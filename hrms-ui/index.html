<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ✅ Relative favicon (GitHub Pages safe) -->
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prakura HRMS</title>

    <!-- ✅ SPA redirect fix for GitHub Pages (DO NOT REMOVE) -->
    <script>
      (function () {
        const redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(
            null,
            null,
            redirect.replace("/prakuratms", "")
          );
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- ✅ Relative module path (MANDATORY for GitHub Pages) -->
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
