name: Deploy Prakura TMS (Frontend)

on:
  push:
    branches:
      - release_3_deploymentFix

# Required for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Avoid parallel deploy conflicts
concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: hrms-ui/package-lock.json

      # 3️⃣ Install dependencies
      - name: Install dependencies
        working-directory: hrms-ui
        run: npm install

      # 4️⃣ Build frontend (Vite)
      - name: Build frontend
        working-directory: hrms-ui
        run: npm run build

      # 5️⃣ Upload dist folder for GitHub Pages
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hrms-ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 6️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
