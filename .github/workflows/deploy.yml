name: Deploy Prakura TMS (Frontend)

on:
  push:
    branches:
      - development

# Required permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping deployments
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: hrms-ui/package-lock.json

      # 3️⃣ Install dependencies (strict & production-safe)
      - name: Install dependencies
        working-directory: hrms-ui
        run: npm ci

      # 4️⃣ Build frontend (Vite)
      - name: Build frontend
        working-directory: hrms-ui
        run: npm run build

      # 5️⃣ Upload build output for GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: hrms-ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      # 6️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
